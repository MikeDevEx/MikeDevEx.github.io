<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Samoware Games</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    header {
      font-size: 2em;
      margin-bottom: 0.5em;
    }

    .description {
      font-size: 1.2em;
      max-width: 600px;
      margin-bottom: 2em;
    }

    .button {
      background-color: #f39c12;
      color: black;
      padding: 0.8em 1.5em;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .button:hover {
      background-color: #d35400;
    }

    footer {
      position: absolute;
      bottom: 1em;
      font-size: 0.8em;
      color: #666;
    }
  </style>
</head>
<body>

  <header>🎮 Samoware Games</header>

  <div class="description">
    Indie games crafted with passion and a bit of chaos.  
    Stay tuned for our upcoming release!
  </div>

  <a class="button" href="https://play.google.com/store/apps/developer?id=Samoware" target="_blank">
    View on Google Play
  </a>

  <footer>
    © 2025 Samoware Games
  </footer>

</body>
</html>
